[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-local"
version = "0.1.0"
description = "Local-first, evidence-preserving engineering retrieval"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Trace contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
# The Phase 1 SDK and CLI use only the Python standard library. In particular,
# installation does not require a server, Docker, account, model, or telemetry
# dependency.
dependencies = []

[project.scripts]
trace = "trace_local.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["trace_local", "trace_local.*"]
