[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-local"
version = "0.1.0"
description = "Local-first, evidence-preserving engineering retrieval"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Trace contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
# The Phase 1 SDK and CLI use only the Python standard library. In particular,
# installation does not require a server, Docker, account, model, or telemetry
# dependency.
dependencies = [
    "jsonschema>=4.20",
    "psutil>=5.9",
    "pydantic>=2.10,<3",
]

[project.scripts]
trace = "trace_local.cli:main"
trace-v2 = "trace.v2.__main__:main"

[project.optional-dependencies]
# V2 remains opt-in so the Phase 1 local CLI stays standard-library-only.
v2 = [
    "fastapi>=0.115,<0.116",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.32,<0.33",
    "python-multipart>=0.0.9",
]
# Pin production integration families to compatible minor ranges. Vendor SDKs
# are imported lazily by the selected adapter, not by the Phase 1 CLI.
production = [
    "fastapi>=0.115,<0.116",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.32,<0.33",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2,<3.3",
    "psycopg-pool>=3.2,<3.3",
    "boto3>=1.35,<2",
    "google-cloud-storage>=2.18,<3",
    "opensearch-py>=2.7,<3",
    "qdrant-client>=1.12,<2",
    "nats-py>=2.9,<3",
    "redis>=5.2,<6",
    "httpx>=0.27,<1",
    "litellm>=1.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "litellm>=1.0",
    "jsonschema>=4.20",
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["trace_local", "trace_local.*", "trace", "trace.*"]

# PostgreSQL migrations are executable production assets.  Keep a source-tree
# copy for operators and install the same checked-in files with wheels so the
# ``trace-v2 migrate`` command has no hidden repository-path dependency.
[tool.setuptools.data-files]
"trace/migrations" = ["migrations/*.sql"]
