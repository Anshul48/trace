[project]
name = "trace"
version = "2.0.0"
description = "Headless, evidence-first cognitive memory substrate"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.139.0",
    "google-auth>=2.55.1",
    "litellm>=1.90.0",
    "networkx>=3.6.1",
    "nltk>=3.10.0",
    "pydantic>=2.13.4",
    "pypdf>=6.0.0",
    "python-magic-bin>=0.4.14",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.0",
    "streamlit>=1.58.0",
    "tenacity>=9.1.4",
    "unstructured>=0.23.1",
    "uvicorn>=0.49.0",
    "watchdog>=6.0.0",
    "websockets>=16.0",
]

[project.optional-dependencies]
production = [
    "boto3>=1.35.0",
    "nats-py>=2.9.0",
    "opensearch-py>=2.7.0",
    "psycopg[binary]>=3.2.0",
    "qdrant-client>=1.12.0",
    "redis>=5.0.0",
    "PyJWT>=2.9.0",
    "opentelemetry-api>=1.27.0",
    "prometheus-client>=0.21.0",
]
