<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="ch-t ch-d">
<title id="ch-t">TRACE memory self-organizing: abstract constellation</title>
<desc id="ch-d">Abstract illustration. Amber particles drift across a dark slate field and gather into four teal schema constellations joined by thin threads. No data is shown.</desc>
<style>
  .d1,.d2{fill:#f5a524}
  .node{fill:#2dd4bf}
  .ring{fill:none;stroke:#2dd4bf;stroke-width:1.5;opacity:.55}
  .thread{stroke:#2dd4bf;stroke-width:1;opacity:.28}
  .d1{animation:drift1 11s ease-in-out infinite alternate}
  .d2{animation:drift2 14s ease-in-out infinite alternate}
  .clus{animation:sway 18s ease-in-out infinite alternate}
  .ring{animation:breathe 6s ease-in-out infinite alternate}
  @keyframes drift1{from{transform:translate(0,0);opacity:.75}to{transform:translate(10px,-12px);opacity:1}}
  @keyframes drift2{from{transform:translate(0,0);opacity:1}to{transform:translate(-12px,10px);opacity:.7}}
  @keyframes sway{from{transform:translate(0,0)}to{transform:translate(8px,6px)}}
  @keyframes breathe{from{opacity:.35}to{opacity:.7}}
  @media (prefers-reduced-motion: reduce){.d1,.d2,.clus,.ring{animation:none}}
</style>
<rect width="1200" height="360" rx="16" fill="#0f172a"/>
<rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-width="2"/>
<!-- cluster 1 -->
<g class="clus" style="animation-delay:0s">
<line x1="190" y1="235" x2="260" y2="215" class="thread"/>
<line x1="260" y1="215" x2="332" y2="191" class="thread"/>
