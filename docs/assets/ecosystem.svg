<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Three projects. TRACE, the memory, is linked to ANIMA by a prototype link. Reflex stands alone.">
  <title>Three projects: TRACE linked to ANIMA (prototype); Reflex separate</title>
  <!-- SWAP: replace this file (docs/assets/ecosystem.svg, same name) with the final map. Keep Reflex with NO line or arrow to TRACE. -->
  <rect width="640" height="400" fill="#ffffff"/>
  <g font-family="system-ui, 'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="60" width="240" height="140" rx="12" fill="#e8eefc" stroke="#1d4ed8" stroke-width="3"/>
    <text x="150" y="115" font-size="32" font-weight="700" fill="#0e1730">TRACE</text>
    <text x="150" y="147" font-size="15" fill="#27345a">the memory</text>
    <text x="150" y="170" font-size="14" fill="#46547a">every answer has a record</text>

    <rect x="370" y="60" width="240" height="140" rx="12" fill="#ffffff" stroke="#aeb8d2" stroke-width="2"/>
    <text x="490" y="115" font-size="32" font-weight="700" fill="#0e1730">ANIMA</text>
    <text x="490" y="147" font-size="15" fill="#27345a">coding-agent harness</text>
    <text x="490" y="170" font-size="14" fill="#46547a">prototype, one job type</text>

    <line x1="270" y1="130" x2="370" y2="130" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="320" y="118" font-size="13" font-style="italic" fill="#27345a">prototype link</text>

    <rect x="200" y="260" width="240" height="110" rx="12" fill="#ffffff" stroke="#aeb8d2" stroke-width="2"/>
    <text x="320" y="312" font-size="32" font-weight="700" fill="#0e1730">Reflex</text>
    <text x="320" y="342" font-size="15" fill="#27345a">a separate project</text>
  </g>
</svg>
