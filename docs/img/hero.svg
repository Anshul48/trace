<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d">
<title id="t">TRACE: search that shows its work</title>
<desc id="d">A question on the left reaches into a large field of faint dots, which stand for a library of passages. It touches only a small bright group of them, and from that group a checked record card is produced.</desc>
