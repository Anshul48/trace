<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img"><title>Per-query wall time by run</title><rect width="880" height="400" fill="#ffffff"/><text x="16" y="30" font-size="16" font-family="sans-serif" fill="#1a1a1a">Per-query wall time by run (log scale, ms; separate panels)</text><rect x="16" y="42" width="118" height="22" rx="4" fill="#0b6e4f"/><text x="24" y="57" font-size="12" fill="#fff" font-family="sans-serif">RECEIPTED</text><text x="142" y="57" font-size="11" fill="#8a8f98" font-family="sans-serif">all bars RECEIPTED (record shipped in this repo), labeled per bar</text><text x="16" y="92" font-size="12" font-family="sans-serif" fill="#1a1a1a">A. This-job stdlib script, laptop CPU: mean per-query wall over 144 atom-queries.</text><text x="16" y="132" font-size="11" fill="#1a1a1a" font-family="sans-serif">this job exact (mean) [RECEIPTED]</text><rect x="250" y="116" width="354.0" height="24" fill="#0b6e4f"/><text x="612.0" y="132" font-size="10" fill="#8a8f98" font-family="sans-serif">4.045 ms (run_20k.json)</text><text x="16" y="174" font-size="11" fill="#1a1a1a" font-family="sans-serif">this job leaf-8 (mean) [RECEIPTED]</text><rect x="250" y="158" width="4.0" height="24" fill="#0b6e4f"/><text x="280.0" y="174" font-size="10" fill="#8a8f98" font-family="sans-serif">2.670 ms (run_20k.json)</text><text x="16" y="212" font-size="12" font-family="sans-serif" fill="#1a1a1a">B. Sealed-library replay service, VM: p50 server time over 144 recorded questions (own axis).</text><text x="16" y="252" font-size="11" fill="#1a1a1a" font-family="sans-serif">replay guided (p50) [RECEIPTED]</text><rect x="250" y="236" width="4.0" height="24" fill="#0b6e4f"/><text x="280.0" y="252" font-size="10" fill="#8a8f98" font-family="sans-serif">1198.8 ms (replay_agg.json)</text><text x="16" y="294" font-size="11" fill="#1a1a1a" font-family="sans-serif">replay exact (p50) [RECEIPTED]</text><rect x="250" y="278" width="354.0" height="24" fill="#0b6e4f"/><text x="612.0" y="294" font-size="10" fill="#8a8f98" font-family="sans-serif">1288.1 ms (replay_agg.json)</text><text x="16" y="348" font-size="11" fill="#8a8f98" font-family="sans-serif">Panel A: exact 4.045467 ms, leaf-8 2.669979 ms (run_20k.json timings/routing means x1000).</text><text x="16" y="362" font-size="11" fill="#8a8f98" font-family="sans-serif">Panel B: guided p50 1198.8 ms, exact p50 1288.1 ms (replay_agg.json tg_ms/tf_ms).</text><text x="16" y="376" font-size="11" fill="#8a8f98" font-family="sans-serif">Separate log axes per panel: read values, not lengths; never compare A against B.</text></svg>