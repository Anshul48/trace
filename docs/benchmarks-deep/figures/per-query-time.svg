<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 0 880 490" role="img"><title>Per-query wall time by run</title><rect width="880" height="490" fill="#ffffff"/><text x="16" y="30" font-size="16" font-family="sans-serif" fill="#1a1a1a">Per-query wall time by run (log scale, ms)</text><rect x="16" y="42" width="118" height="22" rx="4" fill="#4a3aff"/><text x="24" y="57" font-size="12" fill="#fff" font-family="sans-serif">RECORDED-DATA</text><text x="142" y="57" font-size="11" fill="#8a8f98" font-family="sans-serif">mixed: REAL + RECORDED-DATA, labeled per bar</text><text x="16" y="96" font-size="11" fill="#1a1a1a" font-family="sans-serif">Scope: per-query wall time; each bar its own machine and protocol — no cross-bar comparison.</text><text x="16" y="136" font-size="11" fill="#1a1a1a" font-family="sans-serif">this job exact [REAL]</text><rect x="250" y="120" width="86.9" height="24" fill="#0b6e4f"/><text x="344.9" y="136" font-size="10" fill="#8a8f98" font-family="sans-serif">4.63 ms (run_20k.json)</text><text x="16" y="178" font-size="11" fill="#1a1a1a" font-family="sans-serif">this job leaf-8 [REAL]</text><rect x="250" y="162" width="60.8" height="24" fill="#0b6e4f"/><text x="318.8" y="178" font-size="10" fill="#8a8f98" font-family="sans-serif">2.67 ms (run_20k.json)</text><text x="16" y="220" font-size="11" fill="#1a1a1a" font-family="sans-serif">BEIR FiQA exact [RECORDED]</text><rect x="250" y="204" width="122.9" height="24" fill="#4a3aff"/><text x="380.9" y="220" font-size="10" fill="#8a8f98" font-family="sans-serif">9.883 ms (beir summary.md)</text><text x="16" y="262" font-size="11" fill="#1a1a1a" font-family="sans-serif">BEIR FiQA grouped p16 [RECORDED]</text><rect x="250" y="246" width="4.0" height="24" fill="#4a3aff"/><text x="280.0" y="262" font-size="10" fill="#8a8f98" font-family="sans-serif">0.742 ms (beir summary.md)</text><text x="16" y="304" font-size="11" fill="#1a1a1a" font-family="sans-serif">replay guided p50 [RECORDED]</text><rect x="250" y="288" width="350.6" height="24" fill="#4a3aff"/><text x="608.6" y="304" font-size="10" fill="#8a8f98" font-family="sans-serif">1198.8 ms (replay.js)</text><text x="16" y="346" font-size="11" fill="#1a1a1a" font-family="sans-serif">replay exact p50 [RECORDED]</text><rect x="250" y="330" width="354.0" height="24" fill="#4a3aff"/><text x="612.0" y="346" font-size="10" fill="#8a8f98" font-family="sans-serif">1288.1 ms (replay.js)</text><text x="16" y="438" font-size="11" fill="#8a8f98" font-family="sans-serif">Scopes differ per bar — read the labels, not just the lengths.</text><text x="16" y="452" font-size="11" fill="#8a8f98" font-family="sans-serif">This job: 20k prefix on laptop stdlib script. BEIR: FiQA 57,638 passages on Ryzen. Replay: sealed</text><text x="16" y="466" font-size="11" fill="#8a8f98" font-family="sans-serif">812,545-passage library on VM service. Do not compare these against build-memory peaks.</text></svg>