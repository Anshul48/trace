<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img"><title>Peak memory by run</title><rect width="880" height="400" fill="#ffffff"/><text x="16" y="30" font-size="16" font-family="sans-serif" fill="#1a1a1a">Peak memory by run (log scale, MiB; separate panels)</text><rect x="16" y="42" width="118" height="22" rx="4" fill="#0b6e4f"/><text x="24" y="57" font-size="12" fill="#fff" font-family="sans-serif">RECEIPTED</text><text x="142" y="57" font-size="11" fill="#8a8f98" font-family="sans-serif">all bars RECEIPTED (record shipped in this repo), labeled per bar</text><text x="16" y="92" font-size="12" font-family="sans-serif" fill="#1a1a1a">A. This-job stdlib script: whole-process peak (tree loaded from JSON, centres computed; NOT a store build).</text><text x="16" y="132" font-size="11" fill="#1a1a1a" font-family="sans-serif">this job stdlib run [RECEIPTED]</text><rect x="250" y="116" width="123.9" height="24" fill="#0b6e4f"/><text x="381.9" y="132" font-size="10" fill="#8a8f98" font-family="sans-serif">23.30 MiB (run_20k.time.log)</text><text x="16" y="178" font-size="12" font-family="sans-serif" fill="#1a1a1a">B. Full-store builds: peak parent RSS while building (own log axis; not comparable to A).</text><text x="16" y="218" font-size="11" fill="#1a1a1a" font-family="sans-serif">20k frozen pilot [RECEIPTED]</text><rect x="250" y="202" width="4.0" height="24" fill="#0b6e4f"/><text x="280.0" y="218" font-size="10" fill="#8a8f98" font-family="sans-serif">136.6 MiB (pilot-20k-out2/result.json)</text><text x="16" y="260" font-size="11" fill="#1a1a1a" font-family="sans-serif">seam12a build [RECEIPTED]</text><rect x="250" y="244" width="286.2" height="24" fill="#0b6e4f"/><text x="544.2" y="260" font-size="10" fill="#8a8f98" font-family="sans-serif">8489.1 MiB (seam12a-result.json)</text><text x="16" y="302" font-size="11" fill="#1a1a1a" font-family="sans-serif">G5 build [RECEIPTED]</text><rect x="250" y="286" width="354.0" height="24" fill="#0b6e4f"/><text x="612.0" y="302" font-size="10" fill="#8a8f98" font-family="sans-serif">22565.5 MiB (receipts/result.json)</text><text x="16" y="348" font-size="11" fill="#8a8f98" font-family="sans-serif">Panel A: 23856 KiB / 1024 = 23.296875 MiB (run_20k.time.log; cross-checked vs run_20k.json peak_rss_mib).</text><text x="16" y="362" font-size="11" fill="#8a8f98" font-family="sans-serif">Panel B: peak_parent_rss_mib per receipt (pilot/seam12a/G5 full-store builds; scopes in page section 4).</text><text x="16" y="376" font-size="11" fill="#8a8f98" font-family="sans-serif">Separate log axes per panel: read values, not lengths; never compare A against B.</text></svg>