<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img"><title>Peak build memory by run</title><rect width="880" height="400" fill="#ffffff"/><text x="16" y="30" font-size="16" font-family="sans-serif" fill="#1a1a1a">Peak build memory by run (log scale, MiB)</text><rect x="16" y="42" width="118" height="22" rx="4" fill="#4a3aff"/><text x="24" y="57" font-size="12" fill="#fff" font-family="sans-serif">RECORDED-DATA</text><text x="142" y="57" font-size="11" fill="#8a8f98" font-family="sans-serif">mixed: REAL + RECORDED-DATA, labeled per bar</text><text x="16" y="96" font-size="11" fill="#1a1a1a" font-family="sans-serif">Scope: peak resident memory while BUILDING only (never serving); one bar per run.</text><text x="16" y="136" font-size="11" fill="#1a1a1a" font-family="sans-serif">this job stdlib run [REAL]</text><rect x="250" y="120" width="4.0" height="24" fill="#0b6e4f"/><text x="280.0" y="136" font-size="10" fill="#8a8f98" font-family="sans-serif">23.9 MiB (run_20k.time.log)</text><text x="16" y="178" font-size="11" fill="#1a1a1a" font-family="sans-serif">20k frozen pilot [RECORDED]</text><rect x="250" y="162" width="90.1" height="24" fill="#4a3aff"/><text x="348.1" y="178" font-size="10" fill="#8a8f98" font-family="sans-serif">136.6 MiB (pilot-20k-out2/result.json)</text><text x="16" y="220" font-size="11" fill="#1a1a1a" font-family="sans-serif">seam12a build [RECORDED]</text><rect x="250" y="204" width="303.5" height="24" fill="#4a3aff"/><text x="561.5" y="220" font-size="10" fill="#8a8f98" font-family="sans-serif">8489.1 MiB (seam12a-result.json)</text><text x="16" y="262" font-size="11" fill="#1a1a1a" font-family="sans-serif">G5 build [RECORDED]</text><rect x="250" y="246" width="354.0" height="24" fill="#4a3aff"/><text x="612.0" y="262" font-size="10" fill="#8a8f98" font-family="sans-serif">22565.5 MiB (receipts/result.json)</text><text x="16" y="348" font-size="11" fill="#8a8f98" font-family="sans-serif">Scopes differ per bar — read the labels, not just the lengths.</text><text x="16" y="362" font-size="11" fill="#8a8f98" font-family="sans-serif">This job: 20k prefix, 144 atoms. Earlier runs: smaller-corpus builds (see page section 4).</text><text x="16" y="376" font-size="11" fill="#8a8f98" font-family="sans-serif">Do not compare these build peaks against per-query serving figures.</text></svg>